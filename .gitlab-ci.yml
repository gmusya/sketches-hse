variables:
  GIT_SUBMODULE_STRATEGY: recursive

stages:
  - grade

grade:
  stage: grade
  image: ubuntu:24.04
  script:
    - apt-get update
    - apt-get install -y git python3 python3-pip cmake g++ make libgtest-dev curl
    - python3 -m pip install --break-system-packages manytask-checker
    - checker grade . private-2026-spring --verbose
