stages:
  - grade

variables:
  # Override in CI/CD variables with the exact Yandex Container Registry image.
  CHECKER_BASE_IMAGE: "cr.yandex/${YC_REGISTRY_ID}/checker-base:latest"
  CHECKER_PRIVATE_REF_DIR: "/opt/private_ref"

grade:
  stage: grade
  image: "${CHECKER_BASE_IMAGE}"
  script:
    - test -d "${CHECKER_PRIVATE_REF_DIR}"
    - checker grade . "${CHECKER_PRIVATE_REF_DIR}" --verbose
