stages:
  - grade

grade:
  stage: grade
  image: ubuntu:24.04
  script:
    - apt-get update
    - apt-get install -y git python3 python3-pip cmake g++ make libgtest-dev curl
    - python3 -m pip install --break-system-packages --ignore-installed "git+https://github.com/manytask/checker.git@main"
    - python3 -m pip show manytask-checker || true
    - python3 -m pip show checker || true
    - git clone --depth 1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.aysumg.ru/sketches/private-2026-spring.git" ./private_ref
    - checker grade . ./private_ref --verbose
